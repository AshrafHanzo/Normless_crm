# Normless CRM — nginx site config
# Copy to: /etc/nginx/sites-available/ops.normless.store
# Enable:  ln -s /etc/nginx/sites-available/ops.normless.store /etc/nginx/sites-enabled/
# Test:    sudo nginx -t   then   sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d ops.normless.store
#
# The Node app (PM2 on :5000) serves BOTH the API and the built React frontend,
# so nginx just reverse-proxies everything. This avoids /root file-permission
# issues and keeps the config simple.

server {
    listen 80;
    listen [::]:80;
    server_name ops.normless.store;

    # Gzip for faster loads
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
