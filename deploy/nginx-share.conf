# share.normless.store — what customers and vendors are sent. NOT the CRM.
# Copy to: /etc/nginx/sites-available/share.normless.store
# Enable:  ln -s /etc/nginx/sites-available/share.normless.store /etc/nginx/sites-enabled/
# Test:    sudo nginx -t   then   sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d share.normless.store
#
# Same Node app as ops.normless.store, but only the public paths are passed through: the vendor
# page, short links, the vendor page's own API, the page's scripts, and files sent on WhatsApp.
# Everything else is a 404 here — the login page and the CRM's API simply don't exist on this
# name. The app enforces the same list (server/utils/public-urls.js); this is the first lock.

server {
    listen 80;
    listen [::]:80;
    server_name share.normless.store;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_vary on;

    # Vendors upload invoices (10 MB) from their page.
    client_max_body_size 12M;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; }

    # The bare address: the shop.
    location = / { return 302 https://normless.store; }

    # Only these reach the app.
    location ~ ^/(v/[^/]+/?$|go/|api/portal/|assets/|uploads/|api/thumb/|logo/|[^/]+\.(png|svg|ico|webp|jpe?g|webmanifest)$) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { return 404; }
}
